services:
  alert-server:
    build: .
    image: p2s/central-alert-server:1.0.0
    container_name: p2s-central-alert
    restart: unless-stopped
    env_file: .env
    # chạy bằng uid/gid của user host -> file trong data-server thuộc gaban,
    # grep/backup/sqlite3 không cần sudo
    user: "1000:1000"
    ports:
      - "8000:8000"
    volumes:
      # toàn bộ state (alerts.db + evidence/) nằm trên host;
      # xoá/rebuild container không mất dữ liệu
      - /home/gaban/Downloads/php2shell-wrap/data-server:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz', timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
