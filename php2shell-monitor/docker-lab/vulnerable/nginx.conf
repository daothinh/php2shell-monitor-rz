user www-data;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 768;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'request_length=$request_length content_length=$content_length';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Multipart form handling
    client_body_buffer_size 10m;
    proxy_max_temp_file_size 100m;

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/html;
        index index.php index.html index.htm;

        # Log multipart requests explicitly
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;

            # Request timeout for exploit attempts
            fastcgi_read_timeout 10;
            fastcgi_connect_timeout 10;
        }

        # Vulnerable upload endpoint
        location /upload {
            if ($request_method = GET) {
                rewrite ^/upload$ /upload.php last;
            }
            try_files $uri $uri/ /upload.php;
        }
    }
}
