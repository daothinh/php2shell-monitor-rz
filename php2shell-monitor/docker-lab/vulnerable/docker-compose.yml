version: '3.8'

services:
  # Vulnerable PHP 8.2 target
  php82-vulnerable:
    build:
      context: .
      dockerfile: Dockerfile.php82
    container_name: php2shell-lab-8.2
    ports:
      - "8082:80"
    volumes:
      - /tmp/php2shell-docker-logs/php82:/var/log/php-fpm
      - /tmp/php2shell-docker-logs/nginx82:/var/log/nginx
      - ./webroot:/var/www/html
    environment:
      PHP_VERSION: "8.2.34"
      CVE: "CVE-2026-109618,CVE-2026-109619"
    networks:
      - php2shell-lab
    restart: unless-stopped

  # Vulnerable PHP 8.3 target
  php83-vulnerable:
    build:
      context: .
      dockerfile: Dockerfile.php83
    container_name: php2shell-lab-8.3
    ports:
      - "8083:80"
    volumes:
      - /tmp/php2shell-docker-logs/php83:/var/log/php-fpm
      - /tmp/php2shell-docker-logs/nginx83:/var/log/nginx
      - ./webroot:/var/www/html
    environment:
      PHP_VERSION: "8.3.35"
      CVE: "CVE-2026-109618,CVE-2026-109619"
    networks:
      - php2shell-lab
    restart: unless-stopped

  # Patched baseline
  php82-patched:
    image: php:8.2.35-fpm-bookworm
    container_name: php2shell-lab-8.2-patched
    ports:
      - "8084:80"
    volumes:
      - /tmp/php2shell-docker-logs/php82-patched:/var/log/php-fpm
      - /tmp/php2shell-docker-logs/nginx82-patched:/var/log/nginx
      - ./webroot:/var/www/html
    environment:
      PHP_VERSION: "8.2.35"
      PATCHED: "true"
    networks:
      - php2shell-lab
    restart: unless-stopped

volumes:
  php2shell-logs:

networks:
  php2shell-lab:
    driver: bridge
