version: '3.8'

services:
  php2shell-target:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php2shell-target
    ports:
      - "8082:8000"
    volumes:
      - /tmp/php2shell-docker-logs:/var/log/php
    environment:
      PHP_VERSION: "8.2.34"
      CVE: "CVE-2026-109618,CVE-2026-109619"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
