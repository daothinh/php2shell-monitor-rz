# php2shell-monitor default configuration
# Overridden by workdir conf/default.conf (preserved on code update).
# All paths are READ-ONLY inputs; monitor writes ONLY under WORKDIR.

WORKDIR=/tmp/php2shell-monitor

# --- batch loop ---
BATCH_INTERVAL=300

# --- alert dedup (rule,ip,uri within N seconds) ---
DEDUP_WINDOW=900

# --- state/cap management (/tmp may be tmpfs) ---
CAP_TOTAL_MB=200
CAP_KEEP_DAYS=7

# --- baseline ---
# Exclude attack window from learning (leak 2026-10-20; possible first attempts 2026-10-17)
BASELINE_EXCLUDE_SINCE=2026-10-17T00:00:00Z
BASELINE_LEARNING_MAX_BATCHES=2016   # 7 days of 5-min batches before auto "learned"

# --- correlation ---
CORR_WINDOW=5            # seconds, T2->T1 candidate IP window
CORR_WINDOW_MAX=30

# --- score thresholds (aggregated score -> severity) ---
SCORE_MEDIUM=10
SCORE_HIGH=40
SCORE_CRITICAL=80

# --- traffic caps for rules (agg windows) ---
P2S016_WINDOW=600
P2S016_MIN=5
P2S015_BURST=20        # POSTs/5min from one IP to same URI
P2S010_WINDOW=300
P2S010_MIN=5

# --- webroot manifests (semicolon-separated, discovered by discovery.sh) ---
WEBROOTS=

# --- session dirs (semicolon-separated) ---
SESSION_DIRS=/var/lib/php/sessions

# --- explicit log overrides (leave empty = autodiscover) ---
NGINX_ACCESS=
NGINX_ERROR=
APACHE_ACCESS=
APACHE_ERROR=
FPM_LOG=
AUDIT_LOG=/var/log/audit/audit.log

# --- proc scanning (T3) ---
PROC_SCAN=1

# --- limits ---
MAX_EVENTS_PER_BATCH=50000
