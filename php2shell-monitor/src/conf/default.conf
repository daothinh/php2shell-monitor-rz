# php2shell-monitor default configuration
# Overrides: workdir conf/default.conf (preserved on code update).
# All log paths below are READ-ONLY inputs; the monitor writes only under WORKDIR.

# --- batch loop (seconds) ---
BATCH_INTERVAL=300

# --- alert shape ---
# Number of raw hit records embedded in the alert JSON. 0 = no cap: every event
# is sent. Events are the evidence, so the default is the full set; set a
# positive number only to shed payload size on a bandwidth-constrained link.
MAX_EVIDENCE_INLINE=0

# --- preview: các nhóm event nhét kèm alert để hiện thẳng trong Telegram ---
# Alert phải tự đủ để sysadmin đọc tin nhắn mà biết chuyện gì xảy ra; file
# evidence (upload SAU alert) chỉ dùng để tra đầy đủ. Vì vậy alert mang theo
# ALERT_PREVIEW_MAX nhóm event: đã gộp trùng (bỏ mốc thời gian + id phiên),
# nhóm impact=rce xếp trước, mỗi nhóm giữ nguyên văn một dòng log gốc.
#
# 0 = tắt preview (server render danh sách rule như bản cũ).
ALERT_PREVIEW_MAX=8

# --- severity: MỨC ĐỘ trước, SỐ LƯỢNG sau ---
#   impact=rce                -> CRITICAL, bất kể số event (kể cả 1)
#   tổng >= CRIT_THRESHOLD    -> MODERATE (leo thang ồ ạt, chưa có bằng chứng RCE)
#   còn lại                   -> INFO (dò quét / nhiễu nền)
# Rule nào là bằng chứng server đã bị chiếm thì tự khai "impact":"rce" trong
# pack (P2S-020/021/022/024/025/056/057). Một hit duy nhất của các rule đó đã
# đủ CRITICAL: đó là sự thật về mức độ, không phải tần suất.
CRIT_THRESHOLD=5000

# --- evidence retention: number of batch files to keep (2016 = 7d at 300s) ---
EVIDENCE_KEEP=2016

# --- plugin switches ---
# Space separated plugin names to skip, e.g. "docker_logs sessions"
PLUGINS_DISABLED=""
PROC_SCAN=1

# --- explicit log paths (empty = use built-in defaults) ---
NGINX_ACCESS=""
NGINX_ERROR=""
APACHE_ACCESS=""
APACHE_ERROR=""
FPM_LOG=""
AUDIT_LOG=""
SESSION_DIRS=""
WEBROOTS=""

# --- plugin timeouts ---
PLUGIN_TIMEOUT=120

# --- container (Docker) ---
# Một install trên host phải monitor cả host LẪN container chạy trên host đó.
# Plugin container_accesslog đọc access log nginx/apache BÊN TRONG container
# qua /proc/<pid>/root (không cần docker CLI/socket), còn webroot_manifest quét
# webroot trong container để thấy webshell đã drop.
#
# Vì sao không dùng docker json log: PHP-FPM ghi access log theo access.format
# không có %Q%q nên query string mất sạch. Thực đo trên lab:
#   json log   :       0 dòng chứa 'page='
#   access.log : 635.840 dòng chứa 'page='
# Toàn bộ CVE-2026-109618/109619 nằm trong query string, nên json log một mình
# là mù hoàn toàn.
DOCKER_LOG_DIR=/var/lib/docker/containers

# Trần byte đọc cho MỘT lượt của MỘT file access log trong container.
# Container chạy lâu có thể có file 100+ MB; đọc hết một lượt thì vượt
# PLUGIN_TIMEOUT và batch sau lại quay về đầu. Cắt theo trần, các batch sau đọc
# tiếp phần còn lại — không mất dòng nào, chỉ trải ra nhiều batch.
CONTAINER_READ_CAP_BYTES=16777216

# Số dòng giữa hai lần ghi mốc tiến độ (byte + số dòng) khi đọc log lớn.
# Plugin đọc log bằng awk một lượt nên thường xong rất nhanh; mốc này chỉ để
# cứu phần đã quét khi plugin bị PLUGIN_TIMEOUT cắt giữa chừng — không có nó
# thì lần chạy sau đọc lại từ byte 0 và log lớn không bao giờ quét xong.
# Nhỏ hơn = mất ít tiến độ hơn khi bị kill, nhưng ghi state nhiều hơn.
BATCH_CHECKPOINT_LINES=2000
