# php2shell-monitor default configuration
# Overrides: workdir conf/default.conf (preserved on code update).
# All log paths below are READ-ONLY inputs; the monitor writes only under WORKDIR.

# --- batch loop (seconds) ---
BATCH_INTERVAL=300

# --- alert shape ---
# Max number of raw hit records embedded in the alert JSON. The full set always
# lives in <device>/evidence/<batch>.jsonl regardless of this cap.
MAX_EVIDENCE_INLINE=500

# --- evidence retention: number of batch files to keep (2016 = 7d at 300s) ---
EVIDENCE_KEEP=2016

# --- plugin switches ---
# Space separated plugin names to skip, e.g. "docker_logs sessions"
PLUGINS_DISABLED=""
PROC_SCAN=1

# --- explicit log paths (empty = use built-in defaults) ---
NGINX_ACCESS=""
NGINX_ERROR=""
APACHE_ACCESS=""
APACHE_ERROR=""
FPM_LOG=""
AUDIT_LOG=""
SESSION_DIRS=""
WEBROOTS=""

# --- plugin timeouts ---
PLUGIN_TIMEOUT=120
MAX_EVENTS_PER_BATCH=50000
