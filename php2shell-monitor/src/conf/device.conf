# php2shell-monitor — device identity
#
# One monitor installation watches ONE device (host). Every alert and every
# evidence file is stored under:
#   $WORKDIR/projects/<PROJECT>/devices/<DEVICE>/
#
# PROJECT groups all devices of one customer/site, e.g. "khach-hang-a".
# DEVICE identifies the host, e.g. "web01". Keep both to [A-Za-z0-9._-].
# This file is created on first install and is preserved on upgrade.

PROJECT="default"
DEVICE="$(hostname 2>/dev/null || echo unknown)"
